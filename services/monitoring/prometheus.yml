global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "tour-service"
    static_configs:
      - targets: ["tour-service:8080"]

  - job_name: "blog-service"
    static_configs:
      - targets: ["blog-service:8080"]

  - job_name: "follow-service"
    static_configs:
      - targets: ["follow-service:8080"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']