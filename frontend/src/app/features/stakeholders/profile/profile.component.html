<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 py-8 px-4" *ngIf="user.name">
  <div class="max-w-4xl mx-auto">
    
    <!-- Main Profile Card -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <!-- Header with gradient background -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 h-32 relative">
        <div class="absolute -bottom-16 left-8">
          <!-- Profile Image Circle -->
          <div class="w-32 h-32 rounded-full border-4 border-white shadow-lg overflow-hidden relative">
            <img 
              *ngIf="user.profile_image" 
              [src]="user.profile_image" 
              [alt]="(user.name || '') + ' ' + (user.surname || '')"
              class="w-full h-full object-cover absolute inset-0"
              (error)="user.profile_image = null"
            >
            <!-- Fallback avatar with initials -->
            <div 
              *ngIf="!user.profile_image"
              class="w-full h-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center absolute inset-0"
            >
              <span class="text-3xl font-bold text-white">
                {{ (user.name?.charAt(0) || '') + (user.surname?.charAt(0) || '') }}
              </span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Profile Info Section -->
      <div class="pt-20 pb-8 px-8">
        <div class="mb-8 flex justify-between items-start">
          <div class="flex-1">
            <!-- View Mode - Name -->
            <h1 *ngIf="!isEditing" class="text-4xl font-bold text-gray-900">
              {{ user.name }} {{ user.surname }}
            </h1>
            
            <!-- Edit Mode - Name & Surname -->
            <div *ngIf="isEditing" class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                <input 
                  [(ngModel)]="editData.name"
                  type="text"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Enter your first name">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                <input 
                  [(ngModel)]="editData.surname"
                  type="text"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Enter your last name">
              </div>
            </div>
          </div>
          
          <!-- Edit Button -->
          <button 
            *ngIf="!isEditing"
            (click)="startEdit()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center ml-4">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            Edit Profile
          </button>
          
          <!-- Save/Cancel Buttons -->
          <div *ngIf="isEditing" class="flex gap-2 ml-4">
            <button 
              (click)="saveProfile()"
              class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition-colors duration-200">
              Save
            </button>
            <button 
              (click)="cancelEdit()"
              class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition-colors duration-200">
              Cancel
            </button>
          </div>
        </div>

        <!-- Profile Image Edit (only in edit mode) -->
        <div *ngIf="isEditing" class="mb-8 p-4 bg-gray-50 rounded-xl">
          <label class="block text-sm font-medium text-gray-700 mb-2">Profile Image URL</label>
          <input 
            [(ngModel)]="editData.profile_image"
            type="url"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter image URL (e.g., https://example.com/image.jpg)">
          <p class="text-xs text-gray-500 mt-1">Enter a valid image URL to update your profile picture</p>
        </div>

        <!-- Content Grid -->
        <div class="grid md:grid-cols-2 gap-8">
          
          <!-- Biography Section -->
          <div class="bg-gray-50 rounded-xl p-6">
            <div class="flex items-center mb-4">
              <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <h3 class="text-xl font-semibold text-gray-900">Biography</h3>
            </div>
            
            <div class="bg-white rounded-lg p-4">
              <!-- View Mode -->
              <p *ngIf="!isEditing" class="text-gray-700 leading-relaxed" [class.text-gray-400]="!user.biography || user.biography === ''" [class.italic]="!user.biography || user.biography === ''">
                {{ user.biography || 'No biography available yet.' }}
              </p>
              
              <!-- Edit Mode -->
              <div *ngIf="isEditing">
                <label class="block text-sm font-medium text-gray-700 mb-2">Biography</label>
                <textarea 
                  [(ngModel)]="editData.biography"
                  class="w-full h-32 p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Write your biography...">
                </textarea>
              </div>
            </div>
          </div>

          <!-- Motto Section -->
          <div class="bg-gray-50 rounded-xl p-6">
            <div class="flex items-center mb-4">
              <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-1l-4 4z"></path>
                </svg>
              </div>
              <h3 class="text-xl font-semibold text-gray-900">Personal Motto</h3>
            </div>
            
            <div class="bg-white rounded-lg p-4">
              <!-- View Mode -->
              <blockquote *ngIf="!isEditing" class="relative">
                <div class="text-3xl text-indigo-300 absolute -top-2 -left-1" *ngIf="user.motto && user.motto !== ''">"</div>
                <p class="text-gray-700 italic leading-relaxed" [class.pl-6]="user.motto && user.motto !== ''" [class.text-gray-400]="!user.motto || user.motto === ''" [class.not-italic]="!user.motto || user.motto === ''">
                  {{ user.motto || 'No personal motto set yet.' }}
                </p>
                <div class="text-3xl text-indigo-300 absolute -bottom-4 right-0" *ngIf="user.motto && user.motto !== ''">"</div>
              </blockquote>
              
              <!-- Edit Mode -->
              <div *ngIf="isEditing">
                <label class="block text-sm font-medium text-gray-700 mb-2">Personal Motto</label>
                <input 
                  [(ngModel)]="editData.motto"
                  type="text"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                  placeholder="Enter your personal motto...">
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
