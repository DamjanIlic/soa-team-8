<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center mb-6">Create Blog</h2>

  <form (ngSubmit)="createBlog()" class="space-y-4">
    <!-- Title -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="title">Title</label>
      <input
        id="title"
        type="text"
        [(ngModel)]="blog.title"
        name="title"
        #title="ngModel"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div *ngIf="title.invalid && title.touched" class="text-red-500 text-sm mt-1">
        Title is required.
      </div>
    </div>

    <!-- Content -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="content">Content (markdown supported)</label>
      <textarea
        id="content"
        [(ngModel)]="blog.content"
        name="content"
        #content="ngModel"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
        rows="6"
      ></textarea>
      <div *ngIf="content.invalid && content.touched" class="text-red-500 text-sm mt-1">
        Content is required.
      </div>
    </div>

    <!-- Markdown Preview -->
    <div *ngIf="blog.content" class="mt-4 p-4 border border-gray-200 rounded-md bg-gray-50">
      <h3 class="font-semibold mb-2">Preview:</h3>
      <markdown [data]="blog.content"></markdown>
    </div>

    <!-- Image URL -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="image_url">Image URL(optional)</label>
      <input
        id="image_url"
        type="url"
        [(ngModel)]="blog.image_url"
        name="image_url"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="https://example.com/image.jpg"
      />
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition"
    >
      Create Blog
    </button>
  </form>

  <p *ngIf="message" class="mt-4 text-center text-red-500 font-medium">{{ message }}</p>
</div>
