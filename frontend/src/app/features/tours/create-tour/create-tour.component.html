<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center mb-6">Create Tour</h2>

  <form (ngSubmit)="createTour()" class="space-y-4">
    <!-- Name -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="name">Name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="tour.name"
        name="name"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Description -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="description">Description</label>
      <textarea
        id="description"
        [(ngModel)]="tour.description"
        name="description"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
        rows="4"
      ></textarea>
    </div>

    <!-- Difficulty -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="difficulty">Difficulty</label>
      <select
        id="difficulty"
        [(ngModel)]="tour.difficulty"
        name="difficulty"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="EASY">Easy</option>
        <option value="MEDIUM">Medium</option>
        <option value="HARD">Hard</option>
      </select>
    </div>

    <!-- Tags -->
    <div>
      <label class="block mb-1 font-medium text-gray-700" for="tags">Tags (comma separated)</label>
      <input
        id="tags"
        type="text"
        [(ngModel)]="tour.tags"
        name="tags"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition"
    >
      Create Tour
    </button>
  </form>

  <p *ngIf="message" class="mt-4 text-center text-red-500 font-medium">{{ message }}</p>
</div>
