<div class="p-4 max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Add Checkpoints & Durations</h2>

  <!-- Map -->
  <div class="mb-4 border rounded h-96 overflow-hidden">
    <xp-map 
      #map
      [addedCheckpointCollection]="checkpoints"
      (locationSelected)="onLocationSelected($event)"
      (checkpointRemoved)="deleteCheckpoint($event)"
      (routeDistanceKm)="onRouteDistanceUpdated($event)"
      class="w-full h-full">
    </xp-map>
  </div>

  <p class="mt-2 text-gray-600">Current tour length: {{ tourDistanceKm | number:'1.2-2' }} km</p>

  <!-- Transport + Minutes -->
  <div class="mb-4 flex items-center gap-2">
    <label class="font-medium">Transport:</label>
    <select [(ngModel)]="selectedTransport" (change)="onTransportChange(selectedTransport)"
            class="border rounded px-2 py-1">
      <option [ngValue]="TransportType.Walk">Walk</option>
      <option [ngValue]="TransportType.Bike">Bike</option>
      <option [ngValue]="TransportType.Car">Car</option>
    </select>
    <span class="ml-2">Minutes: {{ minutes }}</span>
    <button type="button" (click)="addDuration()" class="ml-2 px-3 py-1 bg-green-600 text-white rounded">+ Add</button>
  </div>

  <!-- Durations Display -->
  <div class="mb-4 flex gap-2 flex-wrap">
    <span *ngFor="let d of durations" class="px-2 py-1 bg-yellow-100 rounded">
      {{ d.transport | titlecase }}: {{ d.minutes }} min
    </span>
  </div>

  <!-- Checkpoint Form -->
  <form [formGroup]="checkpointForm" class="space-y-4">
    <div>
      <label class="block font-medium">Name</label>
      <input type="text" formControlName="name" class="w-full border rounded px-2 py-1" />
    </div>

    <div>
      <label class="block font-medium">Description</label>
      <textarea formControlName="description" class="w-full border rounded px-2 py-1"></textarea>
    </div>

    <div>
      <label class="block font-medium">Latitude</label>
      <input type="number" formControlName="latitude" class="w-full border rounded px-2 py-1" readonly />
    </div>

    <div>
      <label class="block font-medium">Longitude</label>
      <input type="number" formControlName="longitude" class="w-full border rounded px-2 py-1" readonly />
    </div>

    <div>
      <label class="block font-medium">Image URL</label>
      <input type="text" formControlName="image_url" class="w-full border rounded px-2 py-1" placeholder="https://example.com/image.jpg"/>
    </div>

    <button type="button" (click)="addCheckpoint()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      {{ editingCheckpointIndex !== null ? 'Update Checkpoint' : 'Add Checkpoint' }}
    </button>
  </form>

  <!-- Checkpoints List -->
  <div class="mt-6">
    <h3 class="text-xl font-semibold mb-2">Checkpoints</h3>
    <ul class="space-y-2">
      <li *ngFor="let cp of checkpoints; let i = index" class="flex justify-between items-center border p-2 rounded">
        <div>
          <p class="font-medium">{{ cp.name }}</p>
          <p class="text-gray-600 text-sm">{{ cp.description }}</p>
          <p class="text-gray-500 text-sm">Lat: {{ cp.latitude }}, Lng: {{ cp.longitude }}</p>
        </div>
        <div class="flex gap-2">
          <button type="button" (click)="editCheckpoint(i)" class="px-2 py-1 bg-yellow-400 text-black rounded hover:bg-yellow-500">Edit</button>
          <button type="button" (click)="deleteCheckpoint(i)" class="px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700">Delete</button>
        </div>
      </li>
    </ul>
  </div>

  <!-- Finalize Tour -->
  <div class="mt-6 flex gap-2">
    <button (click)="finalizeTour()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Finalize Tour</button>
    
  </div>
</div>
