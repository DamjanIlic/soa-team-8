<div class="p-4 max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Add Checkpoints</h2>

  <form [formGroup]="checkpointForm" (ngSubmit)="addCheckpoint()" class="space-y-4">
    <div>
      <label class="block font-medium">Name</label>
      <input type="text" formControlName="name" class="w-full border rounded px-2 py-1" />
    </div>

    <div>
      <label class="block font-medium">Description</label>
      <textarea formControlName="description" class="w-full border rounded px-2 py-1"></textarea>
    </div>

    <div>
      <label class="block font-medium">Latitude</label>
      <input type="number" formControlName="latitude" class="w-full border rounded px-2 py-1" readonly />
    </div>

    <div>
      <label class="block font-medium">Longitude</label>
      <input type="number" formControlName="longitude" class="w-full border rounded px-2 py-1" readonly />
    </div>

    <div>
      <label class="block font-medium">Secret</label>
      <textarea formControlName="secret" class="w-full border rounded px-2 py-1"></textarea>
    </div>

    <div>
      <label class="block font-medium">Image</label>
      <input type="file" (change)="onFileSelect($event)" accept="image/*" class="block" />
      <img *ngIf="imagePreview" [src]="imagePreview" class="mt-2 max-h-40 rounded" />
    </div>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Checkpoint</button>
  </form>

  <div class="mt-6">
    <button (click)="finalizeTour()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Finalize Tour
    </button>
    <button (click)="cancelTour()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 ml-2">
      Cancel
    </button>
  </div>

  <div class="mt-6">
    <h3 class="font-bold text-xl">Added Checkpoints</h3>
    <ul>
      <li *ngFor="let c of checkpoints">
        {{ c.name }} - {{ c.description }} - Lat: {{ c.latitude }}, Lng: {{ c.longitude }}
      </li>
    </ul>
  </div>
</div>
