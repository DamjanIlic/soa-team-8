<div class="flex flex-col items-center justify-start min-h-screen bg-gray-50 p-6">
  <h2 class="text-4xl font-bold mb-6 text-gray-800">User List</h2>

  <div *ngIf="loading" class="text-lg text-gray-600 mb-4">Loading users...</div>
  <div *ngIf="error" class="text-red-500 mb-4">{{ error }}</div>

  <div class="overflow-x-auto w-full max-w-7xl">
    <table class="min-w-full border border-gray-200 shadow-sm">
      <!-- Header -->
      <thead class="bg-gray-100 text-gray-700 text-left text-lg font-semibold">
        <tr>
          <th class="px-4 py-3 border-b">Avatar</th>
          <th class="px-4 py-3 border-b">Full Name</th>
          <th class="px-4 py-3 border-b">Username</th>
          <th class="px-4 py-3 border-b">Email</th>
          <th class="px-4 py-3 border-b">Role</th>
          <th class="px-4 py-3 border-b">Status</th>
          <th class="px-4 py-3 border-b text-center">Actions</th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody class="bg-white text-gray-800">
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="px-4 py-2 border-b">
            <img
              class="w-16 h-16 object-cover border border-gray-300"
              [src]="user.profile_image || 'https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'"
              alt="avatar"
            />
          </td>
          <td class="px-4 py-2 border-b">{{ user.name }} {{ user.surname }}</td>
          <td class="px-4 py-2 border-b font-semibold">{{ user.username }}</td>
          <td class="px-4 py-2 border-b">{{ user.email }}</td>
          <td class="px-4 py-2 border-b">
            <span class="px-2 py-1 text-sm font-medium text-white bg-blue-600 rounded-sm">{{ user.role }}</span>
          </td>
          <td class="px-4 py-2 border-b">
            <span
              class="px-2 py-1 text-sm font-medium text-white rounded-sm"
              [ngClass]="{
                'bg-green-600': !user.blocked,
                'bg-red-600': user.blocked
              }"
            >
              {{ user.blocked ? 'Blocked' : 'Active' }}
            </span>
          </td>
          <td class="px-4 py-2 border-b text-center space-x-1">
            <!-- <button class="px-2 py-1 text-sm bg-blue-500 text-white hover:bg-blue-600">View</button>
            <button class="px-2 py-1 text-sm bg-yellow-500 text-white hover:bg-yellow-600">Edit</button>
            <button class="px-2 py-1 text-sm bg-red-500 text-white hover:bg-red-600">Delete</button> -->

            <button
              *ngIf="!user.blocked"
              class="px-2 py-1 text-sm border border-red-500 text-red-500 hover:bg-red-50"
              (click)="blockUser(user.userId)"
            >
              Block
            </button>
            <button
              *ngIf="user.blocked"
              class="px-2 py-1 text-sm border border-green-500 text-green-500 hover:bg-green-50"
              (click)="unblockUser(user.userId)"
            >
              Unblock
            </button>
           
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
