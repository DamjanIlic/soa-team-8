<div class="flex flex-col items-center justify-start min-h-screen bg-base-100 p-6">
    <h2 class="text-3xl font-bold mb-6">User List</h2>
  
    <div class="overflow-x-auto w-full max-w-6xl">
      <table class="table table-zebra w-full shadow-lg rounded-lg">
        <!-- Header -->
        <thead class="bg-base-200">
          <tr>
            <th class="text-left">ID</th>
            <th class="text-left">Avatar</th>
            <th class="text-left">Ime i Prezime</th>
            <th class="text-left">Username</th>
            <th class="text-left">Email</th>
            <th class="text-left">Role</th>
            <th class="text-left">Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
  
        <!-- Body -->
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>
              <div class="avatar">
                <div class="w-12 h-12 rounded-full">
                  <img
                    [src]="user.avatarUrl || 'https://via.placeholder.com/48'"
                    alt="avatar"
                  />
                </div>
              </div>
            </td>
            <td>{{ user.firstName }} {{ user.lastName }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge badge-primary">{{ user.role }}</span>
            </td>
            <td>
              <span
                class="badge"
                [ngClass]="{
                  'badge-success': user.status === 'Active',
                  'badge-error': user.status === 'Suspended'
                }"
              >
                {{ user.status }}
              </span>
            </td>
            <td class="text-center space-x-2">
              <button class="btn btn-xs btn-info">View</button>
              <button class="btn btn-xs btn-warning">Edit</button>
              <button class="btn btn-xs btn-error">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
