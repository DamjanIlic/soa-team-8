<!-- Cart Overlay -->
<div *ngIf="isVisible" class="fixed inset-0 z-50 overflow-hidden">
  <!-- Background overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-50" (click)="closeCart()"></div>
  
  <!-- Sidebar -->
  <div class="absolute right-0 top-0 h-full w-96 bg-white shadow-xl transform transition-transform duration-300 ease-in-out">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b bg-gray-50">
      <h2 class="text-lg font-semibold text-gray-900">Shopping Cart</h2>
      <button 
        (click)="closeCart()"
        class="p-2 hover:bg-gray-200 rounded-full transition-colors">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Cart Content -->
    <div class="flex flex-col h-full">
      <!-- Items List -->
      <div class="flex-1 overflow-y-auto p-4">
        <!-- Loading State -->
        <div *ngIf="loading" class="flex justify-center items-center py-8">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !loading" class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
          <p class="text-red-700 text-sm">{{ error }}</p>
        </div>

        <!-- Empty Cart -->
        <div *ngIf="!loading && cart && cart.items.length === 0" class="text-center py-12">
          <svg class="mx-auto h-16 w-16 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m-2.4 0L5 3M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17M17 13v6a2 2 0 01-2 2H9a2 2 0 01-2-2v-6m8 0V9a2 2 0 00-2-2H9a2 2 0 00-2 2v4.01"></path>
          </svg>
          <h3 class="mt-4 text-lg font-medium text-gray-900">Your cart is empty</h3>
          <p class="mt-2 text-gray-500">Add some tours to get started!</p>
        </div>

        <!-- Cart Items -->
        <div *ngIf="!loading && cart && cart.items.length > 0" class="space-y-3">
          <div *ngFor="let item of cart.items" class="bg-gray-50 rounded-lg p-4 border">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <h4 class="font-medium text-gray-900 mb-1">{{ item.tour_name }}</h4>
                <p class="text-lg font-semibold text-blue-600">{{ formatPrice(item.price) }}</p>
              </div>
              <button 
                (click)="removeItem(item.id)"
                class="ml-3 p-1 hover:bg-red-100 rounded-full transition-colors group">
                <svg class="w-4 h-4 text-gray-400 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer with Total and Checkout -->
      <div *ngIf="cart && cart.items.length > 0" class="border-t bg-gray-50 p-4">
        <!-- Total -->
        <div class="flex justify-between items-center mb-4">
          <span class="text-lg font-medium text-gray-900">Total:</span>
          <span class="text-xl font-bold text-blue-600">{{ formatPrice(cart.total) }}</span>
        </div>

        <!-- Checkout Button -->
        <button 
          (click)="checkout()"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200">
          <span *ngIf="!loading">Checkout ({{ getTotalItems() }} items)</span>
          <span *ngIf="loading" class="flex items-center justify-center">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
            Processing...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
